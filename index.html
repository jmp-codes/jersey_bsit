<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jersey Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow ledger column. Login card first, then a summary strip, filter tabs and one row per person. */
:root{
  color-scheme:light;
  --bg:#f3f4f7; --surface:#ffffff; --ink:#14213d; --muted:#586277; --line:#dce0e8;
  --accent:#1d3b6e; --accent-ink:#ffffff; --focus:#2f6fdc;
  --ok:#1b7447; --ok-bg:#e2f2e9; --warn:#8a5200; --warn-bg:#fcefd0; --bad:#a3302a; --bad-bg:#fae3e0;
  --track:#e3e6ed;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e131b; --surface:#161d29; --ink:#e7ebf2; --muted:#9ba6b9; --line:#283142;
    --accent:#8fb0ee; --accent-ink:#0e131b; --focus:#7aa7ff;
    --ok:#62d09a; --ok-bg:#153022; --warn:#f0b84f; --warn-bg:#3a2d0f; --bad:#ff8f86; --bad-bg:#3b1a18;
    --track:#263044;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto}

/* login */
#login{min-height:70vh;display:grid;place-items:center}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.login-card h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0;width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:7px 12px}
.btn.small{padding:7px 12px;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:1.4em}

/* header + summary */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat span{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.bar-note{font-size:13px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tab .n{font-family:var(--mono);margin-left:4px;font-size:13px}

/* ledger rows */
#list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:12px 14px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.row.paid .check{background:var(--ok);border-color:var(--ok)}
.row.paid .check svg{opacity:1;color:#fff}
.row.partial .check{border-color:var(--warn)}
.who{min-width:0}
.who b{display:block;font-weight:600;overflow-wrap:anywhere}
.who small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.amt small{display:block;color:var(--muted);font-size:12px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.row.paid .chip{background:var(--ok-bg);color:var(--ok)}
.row.partial .chip{background:var(--warn-bg);color:var(--warn)}
.row.unpaid .chip{background:var(--bad-bg);color:var(--bad)}
.more{background:transparent;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;font-size:13px;grid-column:2/-1;justify-self:start}
.more:hover{color:var(--ink)}
.detail{padding:4px 14px 16px 56px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.orders li{display:flex;flex-direction:column;gap:2px}
.orders .t{display:flex;justify-content:space-between;gap:12px}
.orders .t span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.orders .s{color:var(--muted);font-size:13px}
.orders .flag{color:var(--warn);font-size:13px}
.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paidon{color:var(--muted);font-size:13px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
#state{color:var(--muted);font-size:13px;min-height:1.2em;margin-bottom:8px}
.foot{margin-top:14px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}

@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:1/-1}
  .line{grid-template-columns:auto minmax(0,1fr) auto}
  .line .chip{grid-column:2;justify-self:start}
  .line .amt{grid-column:3;grid-row:1}
  .more{grid-column:2/-1}
  .detail{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div>
        <h1 id="loginTitle">Jersey Payments</h1>
        <p>Sign in to see who has paid.</p>
      </div>
      <div class="field"><label for="user">Username</label><input id="user" name="user" type="text" autocomplete="username" required></div>
      <div class="field"><label for="pass">Password</label><input id="pass" name="pass" type="password" autocomplete="current-password" required></div>
      <div id="loginErr" class="err" role="alert"></div>
      <button class="btn" id="loginBtn" type="submit">Sign in</button>
    </form>
  </section>

  <section id="app" hidden>
    <header class="top">
      <div>
        <h1>Jersey Payments</h1>
        <p>One line per person. Tick the circle when they have paid in full.</p>
      </div>
      <div class="head-actions">
        <button class="btn ghost" id="exportBtn" type="button">Save backup</button>
        <button class="btn ghost" id="importBtn" type="button">Load backup</button>
        <button class="btn ghost" id="logout" type="button">Sign out</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="summary" aria-live="polite">
      <div class="stats">
        <div class="stat"><span>Collected</span><b id="sCollected">₱0</b></div>
        <div class="stat"><span>Still to collect</span><b id="sDue">₱0</b></div>
        <div class="stat"><span>Total orders</span><b id="sTotal">₱0</b></div>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-label="Share of total collected" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="sBar"></i></div>
      <div class="bar-note" id="sNote"></div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search name or jersey name" aria-label="Search name or jersey name">
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="state" role="status"></div>
    <div id="list"></div>
    <p class="foot">Payments are saved in this browser only. Use Save backup to keep a copy or to open the same records on another device.</p>
  </section>
</div>
<div id="toast" class="toast" role="status" hidden></div>

  var ITER = 250000;
  var USER_NAME = "admin";
  var STORE_KEY = "jersey-payments-v1";

  var $ = function(id){ return document.getElementById(id); };
  var peso = function(n){ return "₱" + Number(n || 0).toLocaleString("en-PH"); };

  var people = [];            /* decrypted orders, in memory only */
  var pay = {};               /* id -> { amountPaid, paidAt, note } */
  var filter = "all", query = "", openId = null, storageOk = true;

  /* ---------- decrypt ---------- */
  function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function decrypt(password){
    var raw = b64(CIPHER), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]).then(function(km){
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
    }).then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }

  /* ---------- sign in ---------- */
  var fails = 0, lockUntil = 0, busy = false;
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var err = $("loginErr");
    if (busy) return;
    var wait = Math.ceil((lockUntil - Date.now()) / 1000);
    if (wait > 0){ err.textContent = "Too many attempts. Try again in " + wait + " seconds."; return; }
    if (!(window.crypto && crypto.subtle)){ err.textContent = "This browser cannot open the page from here. Use the https address or a current browser."; return; }
    var u = $("user").value.trim().toLowerCase(), p = $("pass").value;
    busy = true; $("loginBtn").disabled = true; err.textContent = "Checking…";
    var ok = u === USER_NAME;
    (ok ? decrypt(p) : Promise.reject(new Error("user"))).then(function(data){
      people = data.people; fails = 0; err.textContent = "";
      loadPay(); $("pass").value = "";
      $("login").hidden = true; $("app").hidden = false;
      render();
    }).catch(function(){
      fails++;
      if (fails >= 5){ lockUntil = Date.now() + 30000; fails = 0; err.textContent = "Too many attempts. Try again in 30 seconds."; }
      else err.textContent = "Wrong username or password.";
      $("pass").value = "";
    }).then(function(){ busy = false; $("loginBtn").disabled = false; });
  });
  $("logout").addEventListener("click", function(){
    people = []; pay = {}; openId = null; query = ""; $("search").value = ""; $("list").textContent = "";
    $("app").hidden = true; $("login").hidden = false; $("user").value = ""; $("pass").value = "";
  });

  /* ---------- saved payments ---------- */
  function loadPay(){
    try { pay = JSON.parse(localStorage.getItem(STORE_KEY) || "{}").paid || {}; }
    catch(x){ pay = {}; }
    try { localStorage.setItem(STORE_KEY + "-test", "1"); localStorage.removeItem(STORE_KEY + "-test"); storageOk = true; }
    catch(x){ storageOk = false; }
    $("state").textContent = storageOk ? "" : "This browser is blocking saved data, so changes are lost when you leave. Use Save backup before closing.";
  }
  function savePay(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, paid: pay })); }
    catch(x){ if (storageOk){ storageOk = false; toast("Could not save in this browser. Use Save backup to keep your changes."); } }
  }
  function getPay(id){ var p = pay[id] || {}; return { amountPaid: Number(p.amountPaid || 0), paidAt: p.paidAt || null, note: p.note || "" }; }
  function setPay(id, patch){
    var cur = getPay(id);
    pay[id] = { amountPaid: patch.amountPaid != null ? patch.amountPaid : cur.amountPaid, paidAt: patch.paidAt !== undefined ? patch.paidAt : cur.paidAt, note: patch.note != null ? patch.note : cur.note };
    savePay(); render();
  }
  function today(){
    var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function toast(t){
    var el = $("toast"); el.textContent = t; el.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function(){ el.hidden = true; }, 4000);
  }

  /* ---------- backup ---------- */
  $("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), paid: pay }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "jersey-payments-backup-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("importFile").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var data = JSON.parse(String(r.result)), src = data.paid || {}, next = {}, n = 0;
        people.forEach(function(p){ if (src[p.id]){ next[p.id] = { amountPaid: Number(src[p.id].amountPaid || 0), paidAt: src[p.id].paidAt || null, note: String(src[p.id].note || "") }; n++; } });
        pay = next; savePay(); render(); toast("Loaded payments for " + n + " people.");
      } catch(x){ toast("That file is not a payments backup."); }
    };
    r.readAsText(f);
  });

  /* ---------- rows ---------- */
  function statusOf(p){
    var paid = getPay(p.id).amountPaid, total = Number(p.total || 0);
    if (total > 0 && paid >= total) return "paid";
    if (paid > 0) return "partial";
    return "unpaid";
  }
  var STATUS_LABEL = { paid: "Paid", partial: "Partial", unpaid: "Not paid" };
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function itemSummary(p){
    var c = {}, order = [];
    p.orders.forEach(function(o){ if (!c[o.item]){ c[o.item] = 0; order.push(o.item); } c[o.item]++; });
    return order.map(function(k){ return c[k] > 1 ? k + " ×" + c[k] : k; }).join(" · ");
  }
  function sizeText(o){
    if (o.item === "Jersey Set"){ var s = String(o.size).split("/"); return "Sando " + (s[0] || "").trim() + ", Short " + (s[1] || "").trim(); }
    return "Size " + o.size;
  }
  function buildRow(p){
    var id = p.id, st = statusOf(p), py = getPay(id);
    var row = el("div", "row " + st);
    var line = el("div", "line");

    var check = el("button", "check"); check.type = "button";
    check.setAttribute("aria-pressed", st === "paid" ? "true" : "false");
    check.setAttribute("aria-label", (st === "paid" ? "Mark not paid: " : "Mark paid in full: ") + p.name);
    check.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
    check.addEventListener("click", function(){ st === "paid" ? setPay(id, { amountPaid: 0, paidAt: null }) : setPay(id, { amountPaid: p.total, paidAt: today() }); });

    var who = el("div", "who"); who.appendChild(el("b", null, p.name)); who.appendChild(el("small", null, itemSummary(p)));
    var amt = el("div", "amt"); amt.appendChild(document.createTextNode(peso(p.total)));
    if (st === "partial") amt.appendChild(el("small", null, peso(py.amountPaid) + " paid"));
    var chip = el("span", "chip", STATUS_LABEL[st]);

    var isOpen = openId === id;
    var more = el("button", "more", isOpen ? "Hide details" : "Details"); more.type = "button";
    more.setAttribute("aria-expanded", isOpen ? "true" : "false");
    more.addEventListener("click", function(){ openId = isOpen ? null : id; render(); });

    [check, who, chip, amt, more].forEach(function(n){ line.appendChild(n); });
    row.appendChild(line);

    if (isOpen){
      var d = el("div", "detail");
      var ul = el("ul", "orders");
      p.orders.forEach(function(o){
        var li = el("li"), t = el("div", "t");
        t.appendChild(el("span", null, o.item)); t.appendChild(el("span", null, peso(o.price))); li.appendChild(t);
        var tag = [sizeText(o)]; if (o.number) tag.push("#" + o.number); if (o.jerseyName) tag.push(o.jerseyName);
        li.appendChild(el("div", "s", tag.join(" · ")));
        if (o.remarks) li.appendChild(el("div", "flag", o.remarks));
        ul.appendChild(li);
      });
      d.appendChild(ul);

      var edit = el("div", "edit");
      var f1 = el("div", "field"), l1 = el("label", null, "Amount received (₱)"); l1.htmlFor = "amt-" + id;
      var i1 = el("input"); i1.id = "amt-" + id; i1.type = "number"; i1.min = "0"; i1.step = "1"; i1.inputMode = "numeric"; i1.value = String(py.amountPaid);
      i1.addEventListener("change", function(){ var v = Math.max(0, Math.round(Number(i1.value) || 0)); setPay(id, { amountPaid: v, paidAt: v > 0 ? (py.paidAt || today()) : null }); });
      f1.appendChild(l1); f1.appendChild(i1);
      var f2 = el("div", "field"), l2 = el("label", null, "Note"); l2.htmlFor = "note-" + id;
      var i2 = el("input"); i2.id = "note-" + id; i2.type = "text"; i2.value = py.note; i2.placeholder = "e.g. paid through GCash";
      i2.addEventListener("change", function(){ setPay(id, { note: i2.value.trim() }); });
      f2.appendChild(l2); f2.appendChild(i2);
      edit.appendChild(f1); edit.appendChild(f2); d.appendChild(edit);

      var act = el("div", "actions");
      var b1 = el("button", "btn small", "Mark paid in full"); b1.type = "button";
      b1.addEventListener("click", function(){ setPay(id, { amountPaid: p.total, paidAt: today() }); });
      var b2 = el("button", "btn ghost small", "Mark not paid"); b2.type = "button";
      b2.addEventListener("click", function(){ setPay(id, { amountPaid: 0, paidAt: null }); });
      act.appendChild(b1); act.appendChild(b2);
      if (py.paidAt && st !== "unpaid") act.appendChild(el("span", "paidon", "Last payment recorded " + py.paidAt));
      d.appendChild(act); row.appendChild(d);
    }
    return row;
  }

  /* ---------- summary, tabs, list ---------- */
  var TABS = [["all", "All"], ["unpaid", "Not paid"], ["partial", "Partial"], ["paid", "Paid"]];
  function matches(p){
    if (!query) return true;
    var q = query.toLowerCase();
    if (p.name.toLowerCase().indexOf(q) !== -1) return true;
    return p.orders.some(function(o){ return String(o.jerseyName || "").toLowerCase().indexOf(q) !== -1; });
  }
  function render(){
    var counts = { all: 0, unpaid: 0, partial: 0, paid: 0 }, total = 0, collected = 0;
    people.forEach(function(p){
      var s = statusOf(p); counts.all++; counts[s]++;
      total += p.total; collected += Math.min(getPay(p.id).amountPaid, p.total);
    });
    $("sCollected").textContent = peso(collected);
    $("sDue").textContent = peso(Math.max(0, total - collected));
    $("sTotal").textContent = peso(total);
    var pct = total ? Math.round(collected / total * 100) : 0;
    $("sBar").style.width = pct + "%"; $("bar").setAttribute("aria-valuenow", String(pct));
    $("sNote").textContent = counts.all ? counts.paid + " of " + counts.all + " people paid in full, " + pct + "% of the money collected." : "";

    var tabs = $("tabs"); tabs.textContent = "";
    TABS.forEach(function(t){
      var b = el("button", "tab"); b.type = "button";
      b.setAttribute("aria-pressed", filter === t[0] ? "true" : "false");
      b.appendChild(document.createTextNode(t[1])); b.appendChild(el("span", "n", String(counts[t[0]])));
      b.addEventListener("click", function(){ filter = t[0]; render(); });
      tabs.appendChild(b);
    });

    var list = $("list"); list.textContent = "";
    var shown = 0;
    people.forEach(function(p){
      if ((filter === "all" || statusOf(p) === filter) && matches(p)){ list.appendChild(buildRow(p)); shown++; }
    });
    if (!shown){
      var e = el("div", "empty"); e.appendChild(el("b", null, "Nobody matches"));
      e.appendChild(document.createTextNode("Try another filter or search.")); list.appendChild(e);
    }
  }
  var st;
  $("search").addEventListener("input", function(e){ query = e.target.value.trim(); clearTimeout(st); st = setTimeout(render, 120); });
})();
